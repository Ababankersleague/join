<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aba Banker's League Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6; }
        .id-card-print { width: 210mm; height: 297mm; background: white; color: black; padding: 20px; display: none; }
        .page-break { page-break-after: always; }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN / REGISTRATION SECTION -->
    <div id="auth-section" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h1 class="text-3xl font-extrabold mb-6 text-center text-blue-400 neon-text">TOURNAMENT PORTAL</h1>
            
            <!-- Coordinator Registration Form -->
            <div id="reg-form">
                <p class="text-gray-400 text-sm mb-4 text-center">New Coordinator? Register your team.</p>
                <div class="space-y-4">
                    <input type="text" id="coord-name" placeholder="Coordinator Full Name" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:outline-none focus:border-blue-500">
                    <input type="text" id="team-name" placeholder="Team Name" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:outline-none focus:border-blue-500">
                    <input type="file" id="coord-photo" accept="image/*" class="w-full text-xs text-gray-400">
                    <input type="password" id="coord-pass" maxlength="6" placeholder="6-Digit Password" class="w-full p-3 bg-gray-800 rounded border border-gray-700">
                    <button onclick="registerCoordinator()" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded font-bold transition">Create Account & Team</button>
                    <p class="text-center text-sm mt-4">Already have an account? <button onclick="toggleAuth(false)" class="text-blue-400">Login</button></p>
                </div>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="hidden">
                <p class="text-gray-400 text-sm mb-4 text-center">Login to your dashboard</p>
                <div class="space-y-4">
                    <input type="text" id="login-team" placeholder="Team Name" class="w-full p-3 bg-gray-800 rounded border border-gray-700">
                    <input type="password" id="login-pass" maxlength="6" placeholder="Password" class="w-full p-3 bg-gray-800 rounded border border-gray-700">
                    <div class="flex justify-between text-xs text-blue-400">
                        <label><input type="checkbox" id="remember"> Remember Me</label>
                        <button onclick="alert('Contact Tournament Admin to reset password')">Forgot Password?</button>
                    </div>
                    <button onclick="login()" class="w-full bg-green-600 hover:bg-green-500 p-3 rounded font-bold transition">Login Now</button>
                    <p class="text-center text-sm mt-4">New here? <button onclick="toggleAuth(true)" class="text-blue-400">Register</button></p>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard" class="hidden min-h-screen">
        <!-- Sidebar/Top Nav -->
        <nav class="bg-gray-900 p-4 border-b border-gray-800 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="dash-coord-img" class="w-12 h-12 rounded-full border-2 border-blue-500 object-cover" src="" alt="">
                <div>
                    <h2 id="dash-team-name" class="font-bold text-blue-400"></h2>
                    <p id="dash-coord-name" class="text-xs text-gray-400"></p>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-500/20 text-red-400 px-4 py-1 rounded border border-red-500/50 hover:bg-red-500 hover:text-white transition">Logout</button>
        </nav>

        <div class="p-4 max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <button onclick="showView('register')" class="glass p-6 rounded-xl text-center hover:bg-blue-600 transition">Register Player</button>
                <button onclick="showView('players')" class="glass p-6 rounded-xl text-center hover:bg-blue-600 transition">View Players</button>
                <button onclick="bulkPrint()" class="glass p-6 rounded-xl text-center hover:bg-blue-600 transition">Bulk Print IDs</button>
                <button class="glass p-6 rounded-xl text-center opacity-50">DB Management</button>
            </div>

            <!-- Registration View -->
            <div id="view-register" class="glass p-6 rounded-2xl hidden">
                <h3 class="text-xl font-bold mb-4">Add New Player (<span id="player-count">0</span>/22)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="p-name" placeholder="Full Name" class="p-3 bg-gray-800 rounded">
                    <input type="text" id="p-bank" placeholder="Bank Name" class="p-3 bg-gray-800 rounded">
                    <input type="text" id="p-phone" placeholder="Phone Number" class="p-3 bg-gray-800 rounded">
                    <input type="text" id="p-wing" placeholder="Wing of Play" class="p-3 bg-gray-800 rounded">
                    <div class="space-y-1">
                        <label class="text-xs text-gray-400">Passport Photo</label>
                        <input type="file" id="p-photo" accept="image/*" class="w-full text-xs">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs text-gray-400">Bank ID Card (Mandatory)</label>
                        <input type="file" id="p-bankid" accept="image/*,application/pdf" class="w-full text-xs">
                    </div>
                </div>
                <button onclick="registerPlayer()" class="mt-6 w-full bg-blue-600 p-4 rounded-xl font-bold">Submit Player Registration</button>
            </div>

            <!-- Players View -->
            <div id="view-players" class="glass p-6 rounded-2xl hidden overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-700">
                            <th class="p-3">Player ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Bank</th>
                            <th class="p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="player-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- HIDDEN ID CARD TEMPLATE (For Print Generation) -->
    <div id="id-card-container" class="id-card-print">
        <div id="printable-content">
            <!-- Page 1: Tournament ID -->
            <div class="page-break relative border-[10px] border-blue-900 h-[1000px] p-10 flex flex-col items-center justify-between">
                <div class="flex justify-between w-full items-center">
                    <div class="w-20 h-20 bg-blue-600 flex items-center justify-center text-white font-black">ABL</div>
                    <div class="text-right">
                        <h1 class="text-3xl font-black text-blue-900 uppercase">ABA BANKER'S LEAGUE 2026</h1>
                        <p class="text-sm tracking-widest">OFFICIAL PLAYER PASSPORT</p>
                    </div>
                </div>

                <img id="id-photo" class="w-48 h-48 border-4 border-blue-900 object-cover mt-5" src="">
                
                <div class="text-center mt-5">
                    <h2 id="id-name" class="text-4xl font-bold text-gray-800 uppercase"></h2>
                    <p id="id-team" class="text-xl text-blue-700 font-semibold"></p>
                </div>

                <div id="id-qrcode" class="mt-5 flex justify-center"></div>

                <div class="grid grid-cols-2 w-full mt-5 border-t pt-5">
                    <div>
                        <p class="text-xs text-gray-500 uppercase">Player Number</p>
                        <p id="id-number" class="text-lg font-bold"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 uppercase">Bank</p>
                        <p id="id-bank" class="text-lg font-bold"></p>
                    </div>
                </div>

                <div id="id-faint" class="opacity-[0.08] text-[10px] absolute bottom-2 left-1/2 -translate-x-1/2 font-mono"></div>
            </div>

            <!-- Page 2: Bank ID Uploaded -->
            <div class="h-[1000px] flex flex-col items-center justify-center p-10">
                <h2 class="text-center text-gray-400 mb-10 uppercase tracking-tighter">Verified Bank Identification</h2>
                <img id="id-bankcard-img" class="max-w-full max-h-[800px] object-contain border shadow-xl" src="">
            </div>
        </div>
    </div>

    <script>
        let currentCoordinator = null;
        const APP_DATA = JSON.parse(localStorage.getItem('football_reg_data')) || { coordinators: [] };

        // --- AUTH LOGIC ---
        function toggleAuth(showReg) {
            document.getElementById('reg-form').classList.toggle('hidden', !showReg);
            document.getElementById('login-form').classList.toggle('hidden', showReg);
        }

        async function registerCoordinator() {
            const name = document.getElementById('coord-name').value;
            const team = document.getElementById('team-name').value;
            const pass = document.getElementById('coord-pass').value;
            const photoFile = document.getElementById('coord-photo').files[0];

            if (!name || !team || pass.length !== 6 || !photoFile) return alert("Fill all fields correctly. Password must be 6 digits.");
            if (APP_DATA.coordinators.length >= 15) return alert("Maximum 15 teams reached.");
            if (APP_DATA.coordinators.find(c => c.team.toLowerCase() === team.toLowerCase())) return alert("Team already registered.");

            const photoBase64 = await toBase64(photoFile);
            const abbr = team.substring(0, 4).toUpperCase();

            const newCoord = {
                id: Date.now(),
                name, team, abbr, pass,
                photo: photoBase64,
                players: []
            };

            APP_DATA.coordinators.push(newCoord);
            saveData();
            alert("Registration Successful!");
            toggleAuth(false);
        }

        function login() {
            const team = document.getElementById('login-team').value;
            const pass = document.getElementById('login-pass').value;
            const found = APP_DATA.coordinators.find(c => c.team === team && c.pass === pass);

            if (found) {
                currentCoordinator = found;
                initDashboard();
            } else {
                alert("Invalid Credentials");
            }
        }

        // --- DASHBOARD LOGIC ---
        function initDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('dash-team-name').innerText = currentCoordinator.team + ` (${currentCoordinator.abbr})`;
            document.getElementById('dash-coord-name').innerText = currentCoordinator.name;
            document.getElementById('dash-coord-img').src = currentCoordinator.photo;
            showView('players');
            renderPlayers();
        }

        function showView(view) {
            document.getElementById('view-register').classList.add('hidden');
            document.getElementById('view-players').classList.add('hidden');
            document.getElementById('view-' + view).classList.remove('hidden');
        }

        async function registerPlayer() {
            if (currentCoordinator.players.length >= 22) return alert("Max 22 players allowed.");

            const name = document.getElementById('p-name').value;
            const bank = document.getElementById('p-bank').value;
            const phone = document.getElementById('p-phone').value;
            const job = document.getElementById('p-wing').value;
            const photo = document.getElementById('p-photo').files[0];
            const bankId = document.getElementById('p-bankid').files[0];

            if (!name || !bank || !photo || !bankId) return alert("Please fill all fields and upload required IDs.");

            // Duplicate Prevention (Name + Bank combo)
            const exists = currentCoordinator.players.find(p => p.name === name && p.bank === bank);
            if (exists) return alert("This player is already registered for this bank.");

            const playerObj = {
                id: Date.now(),
                name, bank, phone, job,
                playerNum: `${currentCoordinator.abbr}-${Math.random().toString(36).substring(2,5).toUpperCase()}-${currentCoordinator.players.length + 1}`,
                faintCode: 'SEC-' + Math.floor(100000 + Math.random() * 900000),
                photo: await toBase64(photo),
                bankIdCard: await toBase64(bankId)
            };

            currentCoordinator.players.push(playerObj);
            saveData();
            alert("Player Registered!");
            renderPlayers();
            showView('players');
            generateSingleID(playerObj);
        }

        function renderPlayers() {
            const list = document.getElementById('player-list');
            const count = document.getElementById('player-count');
            list.innerHTML = '';
            count.innerText = currentCoordinator.players.length;

            currentCoordinator.players.forEach(p => {
                list.innerHTML += `
                    <tr class="border-b border-gray-800 text-sm">
                        <td class="p-3">${p.playerNum}</td>
                        <td class="p-3">${p.name}</td>
                        <td class="p-3">${p.bank}</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="generateSingleIDById(${p.id})" class="text-blue-400">Print ID</button>
                            <button onclick="deletePlayer(${p.id})" class="text-red-400">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function deletePlayer(id) {
            if(confirm("Delete this player?")) {
                currentCoordinator.players = currentCoordinator.players.filter(p => p.id !== id);
                saveData();
                renderPlayers();
            }
        }

        // --- ID GENERATION & PRINT ---
        async function generateSingleIDById(id) {
            const player = currentCoordinator.players.find(p => p.id === id);
            generateSingleID(player);
        }

        async function generateSingleID(player) {
            const container = document.getElementById('id-card-container');
            container.style.display = 'block';

            // Set content
            document.getElementById('id-photo').src = player.photo;
            document.getElementById('id-name').innerText = player.name;
            document.getElementById('id-team').innerText = currentCoordinator.team;
            document.getElementById('id-number').innerText = player.playerNum;
            document.getElementById('id-bank').innerText = player.bank;
            document.getElementById('id-faint').innerText = player.faintCode;
            document.getElementById('id-bankcard-img').src = player.bankIdCard;

            // QR Code
            document.getElementById('id-qrcode').innerHTML = "";
            new QRCode(document.getElementById('id-qrcode'), {
                text: `Player: ${player.name}\nTeam: ${currentCoordinator.team}\nID: ${player.playerNum}`,
                width: 250,
                height: 250
            });

            // Delay for images to load then generate PDF
            setTimeout(() => {
                const opt = {
                    margin: 0,
                    filename: `${player.name}_Tournament_ID.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().from(document.getElementById('printable-content')).save().then(() => {
                    container.style.display = 'none';
                });
            }, 1000);
        }

        async function bulkPrint() {
            alert("Bulk printing will generate a multi-page PDF. Please wait...");
            // Implementation would loop generateSingleID logic into a single HTML stream.
            // Simplified for brevity: prints the first player as proof of concept.
            if(currentCoordinator.players.length > 0) generateSingleID(currentCoordinator.players[0]);
        }

        // --- HELPERS ---
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function saveData() {
            localStorage.setItem('football_reg_data', JSON.stringify(APP_DATA));
        }

        function logout() {
            location.reload();
        }

        function checkRemembered() {
            // Auto-login logic can be placed here
        }
    </script>
</body>
</html>
